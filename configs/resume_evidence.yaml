schema_version: "1.0"
dataset_disclosure: "Public synthetic SAML-D (~9.5M transactions); not production data."
protocol_disclosure: "Fixed time-out split with point-in-time features and history-only graph inference."
require_provenance: true
required_comparison_groups: []
llm_publication_path: "reports/public/llm_ecnu_max_evaluation_20260804.json"
llm_adjudication_paths:
  - "golden/llm_adjudication_ecnu_max_v1.json"
  - "golden/llm_adjudication_ecnu_max_v3.json"
  - "golden/llm_adjudication_ecnu_max_holdout_v1.json"
  - "golden/llm_adjudication_ecnu_max_holdout_v2.json"
  - "golden/llm_adjudication_ecnu_max_holdout_v3.json"
  - "golden/llm_adjudication_ecnu_max_holdout_v4.json"
  - "golden/llm_adjudication_ecnu_max_holdout_v5.json"
llm_holdout_protocol_paths:
  - "golden/llm_holdout_protocol_v1.json"
  - "golden/llm_holdout_protocol_v2.json"
  - "golden/llm_holdout_protocol_v3.json"
  - "golden/llm_holdout_protocol_v4.json"
  - "golden/llm_holdout_protocol_v5.json"
sources:
  - source_id: "current_lightgbm_fe_v2"
    display_name: "LightGBM FE v2 主线"
    artifact_dir: "artifacts/table_lightgbm_fe_v2"
    required: true
    score_path: "artifacts/table_lightgbm_fe_v2/scores/table_test_scores.parquet"
    score_column: "lightgbm"
    expected_test_start_date: "2023-07-01"
    expected_test_end_date: "2023-08-23"
  - source_id: "current_gat_novelty"
    display_name: "GAT + 时点新颖性主线"
    artifact_dir: "artifacts/gat_cold_start_v3_novelty_only_60d_seed20260723_frozen_test"
    required: true
    score_path: "artifacts/gat_cold_start_v3_novelty_only_60d_seed20260723_frozen_test/scores/graphsage_test_scores.parquet"
    score_column: "graphsage"
    expected_test_start_date: "2023-07-01"
    expected_test_end_date: "2023-08-23"
    bootstrap_path: "artifacts/gat_cold_start_v3_novelty_only_60d_seed20260723_frozen_test/paired_vs_gat_v1_local_replay.json"
    minimum_bootstrap_iterations: 200
  - source_id: "current_oof_fusion"
    display_name: "LightGBM FE v2 + 本机 GAT v1 OOF 融合"
    artifact_dir: "artifacts/fusion_test_lightgbm_fe_v2_gat_v1"
    required: true
    score_path: "artifacts/fusion_test_lightgbm_fe_v2_gat_v1/test_fusion_scores.parquet"
    score_column: "fusion_calibrated_probability"
    expected_test_start_date: "2023-07-01"
    expected_test_end_date: "2023-08-23"
    bootstrap_path: "artifacts/fusion_test_lightgbm_fe_v2_gat_v1/metrics.json"
    minimum_bootstrap_iterations: 200
