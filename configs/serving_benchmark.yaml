schema_version: "1.0"
hardware_disclosure: "Windows local development host, 16 logical CPUs; no production traffic."
boundary_notes:
  - "冻结评分使用 v1 CatBoost 与 2023-07-01 完整 PIT 日期分区，不含 GAT 或融合；吞吐单位是分区/秒，不是交易/秒。"
  - "受控 Agent 指标是一个启动、查询、审批恢复周期的端到端延迟。"
  - "幂等探针共发出 400 个 review 请求，其中 350 个为持久化回放；独立审计库仅有 50 条 review 与 50 条 finalize。该保证限于单 API 进程，不代表多 worker exactly-once。"
sources:
  - source_id: "mock_health"
    display_name: "Mock 健康检查"
    artifact_dir: "artifacts/serving_benchmark_p0_success"
    required: true
  - source_id: "mock_draft"
    display_name: "Mock 调查草稿"
    artifact_dir: "artifacts/serving_benchmark_mock_draft_p0"
    required: true
  - source_id: "frozen_scoring"
    display_name: "冻结 CatBoost v1 分区评分"
    artifact_dir: "artifacts/serving_benchmark_frozen_scoring"
    required: true
  - source_id: "controlled_agent"
    display_name: "受控 Agent 查询/恢复"
    artifact_dir: "artifacts/serving_benchmark_controlled_agent"
    required: true
  - source_id: "controlled_agent_idempotency"
    display_name: "Agent 幂等探针（每周期 8 个并发同键审批）"
    artifact_dir: "artifacts/serving_benchmark_agent_idempotency"
    required: true
