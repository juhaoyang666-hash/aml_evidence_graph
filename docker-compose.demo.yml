services:
  aml-demo:
    build: .
    environment:
      AML_ENV: demo
      AML_LLM_ENABLED: "false"
      AML_TYPOLOGY_ROOT: /app/knowledge/typologies
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          assert urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
