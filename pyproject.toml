[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aml-evidence-graph"
version = "1.0.0"
description = "Auditable graph-enhanced AML transaction risk scoring and investigation assistance."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "catboost>=1.2.7",
  "fastapi>=0.115.0",
  "numpy>=1.26.4",
  "pandas>=2.2.3",
  "polars>=1.9.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "psutil>=6.0",
  "pyarrow>=17.0.0",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.5.2",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
graph = [
  "torch>=2.4.0",
  "torch-geometric>=2.6.0",
]
llm = [
  "httpx>=0.27.0",
  "langgraph>=0.2.50",
  "rank-bm25>=0.2.2",
]
agent-persistence = [
  "langgraph-checkpoint-sqlite>=3.0.1",
]
retrieval = [
  "sentence-transformers>=3.0.0",
]
benchmark = [
  "httpx>=0.27.0",
]
batch = [
  "duckdb>=1.0.0",
]
mlops = [
  "mlflow>=3.0.0",
]
spark = [
  "pyspark>=3.5.0,<5",
]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.7.0",
]

[project.scripts]
aml-api = "aml_evidence_graph.api.app:main"
aml-build-investigation-views = "aml_evidence_graph.aggregation.views:main"
aml-build-pit-features = "aml_evidence_graph.features.build:main"
aml-build-cold-start-features = "aml_evidence_graph.features.cold_start:main"
aml-convert-private-data = "aml_evidence_graph.ingestion.prepare:main"
aml-convert-saml-d = "aml_evidence_graph.ingestion.prepare:main"
aml-convert-transactions = "aml_evidence_graph.ingestion.prepare:main"
aml-prepare-smoke-subset = "aml_evidence_graph.ingestion.smoke_subset:main"
aml-evaluate-fusion = "aml_evidence_graph.training.evaluate_fusion:main"
aml-fit-fusion = "aml_evidence_graph.training.fusion:main"
aml-generate-table-oof = "aml_evidence_graph.training.oof:main"
aml-evaluate-golden = "aml_evidence_graph.investigation.golden:main"
aml-profile-data = "aml_evidence_graph.ingestion.profile:main"
aml-train-graphsage = "aml_evidence_graph.training.run_graphsage:main"
aml-train-table = "aml_evidence_graph.training.table_baseline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aml_evidence_graph"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "aml_evidence_graph/configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
